<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
      <circle cx="2" cy="2" r="1.1" fill="#F4F2C9" fill-opacity="0.07"/>
    </pattern>
    <pattern id="ka-grid" width="220" height="140" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <text x="10" y="40" font-family="Baloo 2, sans-serif" font-weight="800" font-size="34" fill="#F4F2C9" fill-opacity="0.10">K &amp; A</text>
      <text x="110" y="110" font-family="Baloo 2, sans-serif" font-weight="800" font-size="34" fill="#F4F2C9" fill-opacity="0.10">K &amp; A</text>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#090D16"/>
  <rect width="1600" height="900" fill="url(#ka-grid)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <!-- original cat mark: pointed ears, almond eyes, ribbon bow (not Hello Kitty's rounded ears / triple-circle bow) -->
  <g transform="translate(1180,480)" opacity="0.9">
    <!-- head -->
    <path d="M -210 -40
             C -230 -170, -120 -230, -40 -190
             L -20 -230 L 30 -195
             C 60 -225, 150 -220, 170 -190
             L 200 -225 L 230 -180
             C 300 -140, 300 10, 230 70
             C 170 150, -140 150, -210 70
             C -250 20, -250 -5, -210 -40 Z"
          fill="none" stroke="#F4F2C9" stroke-width="7" stroke-opacity="0.5"/>
    <!-- ears inner -->
    <path d="M -28 -205 L -10 -150 L -55 -165 Z" fill="#F4F2C9" fill-opacity="0.12"/>
    <path d="M 195 -200 L 180 -145 L 220 -165 Z" fill="#F4F2C9" fill-opacity="0.12"/>
    <!-- eyes -->
    <ellipse cx="-90" cy="-10" rx="16" ry="22" fill="#F4F2C9" fill-opacity="0.55" transform="rotate(-10 -90 -10)"/>
    <ellipse cx="70" cy="-14" rx="16" ry="22" fill="#F4F2C9" fill-opacity="0.55" transform="rotate(10 70 -14)"/>
    <!-- nose -->
    <path d="M -15 40 L 15 40 L 0 60 Z" fill="#F4F2C9" fill-opacity="0.45"/>
    <!-- whiskers -->
    <g stroke="#F4F2C9" stroke-opacity="0.4" stroke-width="4" stroke-linecap="round">
      <line x1="-230" y1="20" x2="-330" y2="0"/>
      <line x1="-230" y1="45" x2="-330" y2="45"/>
      <line x1="-230" y1="70" x2="-330" y2="90"/>
      <line x1="250" y1="20" x2="350" y2="0"/>
      <line x1="250" y1="45" x2="350" y2="45"/>
      <line x1="250" y1="70" x2="350" y2="90"/>
    </g>
    <!-- ribbon bow (single knot + two loops + tails, distinct from HK's bow) -->
    <g transform="translate(-150,-205) rotate(-18)">
      <path d="M 0 0 C -55 -35 -95 10 -40 25 C -90 45 -50 85 0 55 Z" fill="#E5092F"/>
      <path d="M 0 0 C 55 -35 95 10 40 25 C 90 45 50 85 0 55 Z" fill="#D90429"/>
      <rect x="-14" y="5" width="28" height="40" rx="6" fill="#FF163D"/>
      <path d="M -10 42 L -28 90 L -6 78 Z" fill="#E5092F"/>
      <path d="M 10 42 L 28 90 L 6 78 Z" fill="#D90429"/>
    </g>
  </g>
</svg>
