<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- original cat mark: pointed ears, almond eyes, ribbon bow (not Hello Kitty's rounded ears / triple-circle bow) -->
  <g transform="translate(250,270)">
    <!-- head -->
    <path d="M -175 -30
             C -192 -142, -100 -192, -33 -158
             L -17 -192 L 25 -163
             C 50 -188, 125 -184, 142 -158
             L 167 -188 L 192 -150
             C 250 -117, 250 8, 192 58
             C 142 125, -117 125, -175 58
             C -208 17, -208 -4, -175 -30 Z"
          fill="none" stroke="#F4F2C9" stroke-width="9" stroke-opacity="0.75"/>
    <!-- ears inner -->
    <path d="M -23 -171 L -8 -125 L -46 -138 Z" fill="#F4F2C9" fill-opacity="0.2"/>
    <path d="M 163 -167 L 150 -121 L 183 -138 Z" fill="#F4F2C9" fill-opacity="0.2"/>
    <!-- eyes -->
    <ellipse cx="-75" cy="-8" rx="14" ry="19" fill="#F4F2C9" fill-opacity="0.85" transform="rotate(-10 -75 -8)"/>
    <ellipse cx="58" cy="-12" rx="14" ry="19" fill="#F4F2C9" fill-opacity="0.85" transform="rotate(10 58 -12)"/>
    <!-- nose -->
    <path d="M -12 33 L 12 33 L 0 50 Z" fill="#F4F2C9" fill-opacity="0.7"/>
    <!-- whiskers -->
    <g stroke="#F4F2C9" stroke-opacity="0.6" stroke-width="5" stroke-linecap="round">
      <line x1="-192" y1="18" x2="-275" y2="2"/>
      <line x1="-192" y1="38" x2="-275" y2="38"/>
      <line x1="-192" y1="58" x2="-275" y2="75"/>
      <line x1="208" y1="18" x2="291" y2="2"/>
      <line x1="208" y1="38" x2="291" y2="38"/>
      <line x1="208" y1="58" x2="291" y2="75"/>
    </g>
    <!-- ribbon bow (single knot + two loops + tails, distinct from HK's bow) -->
    <g transform="translate(-125,-171) rotate(-18)">
      <path d="M 0 0 C -46 -29 -79 8 -33 21 C -75 37 -42 71 0 46 Z" fill="#E5092F"/>
      <path d="M 0 0 C 46 -29 79 8 33 21 C 75 37 42 71 0 46 Z" fill="#D90429"/>
      <rect x="-12" y="4" width="24" height="34" rx="5" fill="#FF163D"/>
      <path d="M -8 35 L -23 75 L -5 65 Z" fill="#E5092F"/>
      <path d="M 8 35 L 23 75 L 5 65 Z" fill="#D90429"/>
    </g>
  </g>
</svg>
